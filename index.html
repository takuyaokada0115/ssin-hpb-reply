<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex" />
<title>口コミ返信作成 | SSIN STUDIO下北沢</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #2b2b2b;
    --sub: #8a8577;
    --line: #e6e1d6;
    --accent: #b98a5e;
    --accent-dark: #9c6f45;
    --ok: #4b7f6a;
    --warn: #b5654a;
    --shadow: 0 8px 30px rgba(60, 50, 30, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
    padding: 24px 16px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  header .brand { font-size: 13px; letter-spacing: .18em; color: var(--accent-dark); font-weight: 700; }
  header h1 { font-size: 20px; margin: 6px 0 4px; font-weight: 700; }
  header p { font-size: 13px; color: var(--sub); margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px 16px;
    margin-bottom: 16px;
  }
  .step { font-size: 12px; letter-spacing: .1em; color: var(--accent-dark); font-weight: 700; margin-bottom: 8px; }

  label.field-label { display: block; font-size: 13px; color: var(--sub); margin: 4px 0 6px; }

  textarea {
    width: 100%; min-height: 120px; resize: vertical;
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; font-family: inherit;
    color: var(--ink); background: #fbfaf6; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: var(--accent); background: #fff; }

  .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; color: var(--sub); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .drop {
    border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 20px 14px; text-align: center; color: var(--sub);
    background: #fbfaf6; cursor: pointer; transition: .15s;
    font-size: 14px;
  }
  .drop.drag { border-color: var(--accent); background: #fff7ee; color: var(--accent-dark); }
  .drop strong { color: var(--accent-dark); font-weight: 700; }
  .drop small { display: block; margin-top: 4px; font-size: 12px; color: var(--sub); }
  #fileInput { display: none; }

  .preview { margin-top: 12px; position: relative; display: none; }
  .preview img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .preview button {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,.6); color: #fff; border: none;
    width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }

  button.primary {
    width: 100%; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
    padding: 15px; cursor: pointer; transition: .15s; font-family: inherit;
    margin-top: 4px;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { opacity: .55; cursor: default; }

  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: #f3ede2; color: var(--accent-dark); border: 1px solid var(--line); font-weight: 600;
  }
  .chip.pos { background: #e8f1ec; color: var(--ok); border-color: #d3e6dc; }
  .chip.neg { background: #f7e9e4; color: var(--warn); border-color: #eed5cc; }

  .result-box {
    width: 100%; min-height: 130px; border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; font-size: 15px; line-height: 1.75;
    background: #fbfaf6; white-space: pre-wrap; color: var(--ink);
  }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row button {
    flex: 1; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .row button.copy { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row button.copy.done { background: var(--ok); border-color: var(--ok); }

  #result, #loading, #error { display: none; }
  #loading { text-align: center; color: var(--sub); padding: 8px 0; font-size: 14px; }
  .spinner {
    width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { color: var(--warn); background: #f7e9e4; border: 1px solid #eed5cc; border-radius: 12px; padding: 12px 14px; font-size: 14px; }

  .nav { text-align: center; margin-bottom: 18px; }
  .nav a { font-size: 12px; color: var(--sub); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .nav a:hover { color: var(--accent-dark); }

  footer { text-align: center; color: var(--sub); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">SSIN STUDIO 下北沢</div>
    <h1>口コミ返信 作成ツール</h1>
    <p>HPBの口コミを貼り付けると、返信文を自動で作成します</p>
  </header>
  <div class="nav"><a href="./daily-report.html">スタッフ日報 作成ツールへ</a></div>

  <div class="card">
    <div class="step">STEP 1　口コミを入力</div>
    <label class="field-label" for="reviewText">口コミ本文を貼り付け（テキスト）</label>
    <textarea id="reviewText" placeholder="お客様の口コミ本文とニックネームをここに貼り付けてください。"></textarea>

    <div class="divider">または</div>

    <div class="drop" id="drop">
      <strong>スクリーンショットを貼り付け</strong>
      <small>タップして画像を選択 ／ 画像をドラッグ＆ドロップ ／ ⌘Vで貼り付け</small>
    </div>
    <input type="file" id="fileInput" accept="image/*" />
    <div class="preview" id="preview">
      <img id="previewImg" alt="添付画像" />
      <button type="button" id="removeImg" aria-label="画像を削除">×</button>
    </div>
  </div>

  <button class="primary" id="generateBtn">返信文を作成する</button>

  <div id="loading" class="card">
    <div class="spinner"></div>
    口コミを読み取って返信文を作成しています…
  </div>

  <div id="error" class="card"></div>

  <div id="result" class="card">
    <div class="step">STEP 2　返信文をコピーしてHPBに貼り付け</div>
    <div class="meta" id="meta"></div>
    <div class="result-box" id="replyText"></div>
    <div class="row">
      <button id="copyBtn" class="copy">コピーする</button>
      <button id="regenBtn">作り直す</button>
    </div>
  </div>

  <footer>生成された文章は投稿前に必ずご確認ください。</footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const reviewText = $("reviewText");
  const drop = $("drop");
  const fileInput = $("fileInput");
  const preview = $("preview");
  const previewImg = $("previewImg");
  const generateBtn = $("generateBtn");

  let imageData = null; // { media_type, data }

  // ---- 画像の取り込み（選択 / ドロップ / 貼り付け） ----
  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    resizeImage(file, 1500, (mediaType, base64) => {
      imageData = { media_type: mediaType, data: base64 };
      previewImg.src = "data:" + mediaType + ";base64," + base64;
      preview.style.display = "block";
    });
  }

  // 画像を縮小して base64 化（送信サイズ・コスト削減）
  function resizeImage(file, maxSize, cb) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          const scale = maxSize / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
        cb("image/jpeg", dataUrl.split(",")[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  drop.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));

  ["dragenter", "dragover"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("drag"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("drag"); })
  );
  drop.addEventListener("drop", (e) => {
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  window.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith("image/")) { handleFile(item.getAsFile()); break; }
    }
  });

  $("removeImg").addEventListener("click", () => {
    imageData = null; preview.style.display = "none"; previewImg.src = ""; fileInput.value = "";
  });

  // ---- 生成 ----
  const loading = $("loading");
  const errorBox = $("error");
  const result = $("result");

  function setLoading(on) {
    loading.style.display = on ? "block" : "none";
    generateBtn.disabled = on;
    if (on) { result.style.display = "none"; errorBox.style.display = "none"; }
  }
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }

  const SENTIMENT_LABEL = { positive: "満足・好意的", mixed: "賛否混在", negative: "不満・お叱り", unknown: "判定不能" };

  async function generate() {
    const text = reviewText.value.trim();
    if (!text && !imageData) { showError("口コミのテキストか画像を入力してください。"); return; }
    setLoading(true);
    try {
      const res = await fetch("/.netlify/functions/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, image: imageData }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "生成に失敗しました。");
      renderResult(data);
    } catch (err) {
      showError(err.message || "通信エラーが発生しました。");
    } finally {
      setLoading(false);
    }
  }

  function renderResult(data) {
    const meta = $("meta");
    meta.innerHTML = "";
    if (data.nickname) meta.appendChild(chip("宛先：" + data.nickname + " 様"));
    const s = data.sentiment || "unknown";
    meta.appendChild(chip("評価：" + (SENTIMENT_LABEL[s] || s), s === "positive" ? "pos" : s === "negative" ? "neg" : ""));
    if (data.enthusiasm) meta.appendChild(chip("熱量：" + "★".repeat(data.enthusiasm) + "☆".repeat(5 - data.enthusiasm)));

    $("replyText").textContent = data.reply || "";
    result.style.display = "block";
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function chip(text, cls) {
    const el = document.createElement("span");
    el.className = "chip" + (cls ? " " + cls : "");
    el.textContent = text;
    return el;
  }

  generateBtn.addEventListener("click", generate);
  $("regenBtn").addEventListener("click", generate);

  const copyBtn = $("copyBtn");
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("replyText").textContent);
      copyBtn.textContent = "コピーしました";
      copyBtn.classList.add("done");
      setTimeout(() => { copyBtn.textContent = "コピーする"; copyBtn.classList.remove("done"); }, 1800);
    } catch {
      showError("コピーに失敗しました。手動で選択してコピーしてください。");
    }
  });
</script>
</body>
</html>
